<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MEDS</title>

  <link rel="icon" href="/fehra-meds/favicon.ico?v=2" sizes="any">
  <link rel="shortcut icon" href="/fehra-meds/favicon.ico?v=2">
  <link rel="icon" type="image/png" href="/fehra-meds/favicon.png?v=2">
  <link rel="apple-touch-icon" href="/fehra-meds/favicon.png?v=2">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e8f8ef, #f7faf9);
      color: #12312c;
      padding: 18px;
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
      padding-bottom: 30px;
    }

    .header {
      margin-bottom: 18px;
      padding: 18px 8px 4px;
      position: relative;
    }

    .header h1 {
      margin: 0;
      font-size: 56px;
      line-height: 1;
      letter-spacing: 3px;
      color: #0b6f5c;
      font-weight: 900;
    }

    .leaf {
      position: absolute;
      right: 20px;
      top: 18px;
      width: 64px;
      height: 64px;
      opacity: 0.22;
      color: #0b6f5c;
    }

    .section {
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      padding: 14px;
      margin-bottom: 18px;
      box-shadow: 0 14px 35px rgba(23, 92, 75, 0.12);
      backdrop-filter: blur(12px);
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 4px 2px 14px;
    }

    .section-icon {
      min-width: 34px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #e1f4ea;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0b7a62;
    }

    .section-title {
      margin: 0;
      font-size: 22px;
      color: #102c27;
    }

    .progress-wrap {
      margin-top: 14px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 800;
      color: #3f5c55;
      margin-bottom: 7px;
    }

    .progress-bar {
      width: 100%;
      height: 12px;
      background: #dfe8e5;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(135deg, #09916f, #08715b);
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 13px;
      margin-bottom: 12px;
      box-shadow: 0 6px 18px rgba(15, 78, 66, 0.08);
      border: 1px solid #edf3f1;
    }

    .medicine-row {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
    }

    .medicine-icon {
      min-width: 54px;
      width: 54px;
      height: 54px;
      border-radius: 14px;
      background: #e3f5ee;
      color: #0b7a62;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .medicine-title {
      font-size: 19px;
      font-weight: 800;
      color: #102c27;
    }

    .icon-svg {
      width: 24px;
      height: 24px;
      display: block;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .medicine-icon .icon-svg {
      width: 30px;
      height: 30px;
    }

    .leaf .icon-svg {
      width: 64px;
      height: 64px;
      stroke-width: 1.8;
    }

    .icon-text {
      font-size: 16px;
      font-weight: 900;
      color: #0b7a62;
      letter-spacing: -0.5px;
    }

    .checkbox-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }

    .checkbox-group.two {
      grid-template-columns: repeat(2, 1fr);
    }

    .checkbox-group.single {
      grid-template-columns: 1fr;
    }

    label {
      cursor: pointer;
      user-select: none;
    }

    input[type="checkbox"] {
      display: none;
    }

    .check-box {
      display: block;
      text-align: center;
      padding: 10px 8px;
      border-radius: 11px;
      background: #ffffff;
      color: #64706d;
      font-size: 15px;
      font-weight: 700;
      border: 1px solid #dfe8e5;
      box-shadow: 0 3px 8px rgba(0,0,0,0.04);
      transition: 0.2s ease;
    }

    .checkbox-group.single .check-box {
      padding: 14px 8px;
      font-size: 17px;
    }

    input[type="checkbox"]:checked + .check-box {
      background: linear-gradient(135deg, #09916f, #08715b);
      color: #ffffff;
      border-color: #08715b;
      box-shadow: 0 6px 14px rgba(8, 113, 91, 0.28);
    }

    input[type="checkbox"]:checked + .check-box::before {
      content: "✓ ";
      font-weight: 900;
    }

    .reset {
      width: 100%;
      border: none;
      border-radius: 15px;
      padding: 14px;
      margin-top: 4px;
      background: #fff0ef;
      color: #c01818;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .reset:active {
      transform: scale(0.98);
    }

    @media (max-width: 430px) {
      body { padding: 12px; }
      .header h1 { font-size: 48px; }

      .leaf {
        width: 52px;
        height: 52px;
      }

      .leaf .icon-svg {
        width: 52px;
        height: 52px;
      }

      .checkbox-group { gap: 7px; }

      .check-box {
        font-size: 14px;
        padding: 9px 5px;
      }

      .checkbox-group.single .check-box {
        font-size: 16px;
        padding: 13px 8px;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <header class="header">
      <div class="leaf" aria-hidden="true">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <path d="M20 4c-7.5.5-12.5 4.2-14.5 10.5C4.5 17.8 6.8 20 10 19c6.2-1.9 9.7-7 10-15z"></path>
          <path d="M5 20c3.2-5.8 7.2-9.6 12-11.5"></path>
        </svg>
      </div>

      <h1>MEDS</h1>
    </header>

    <section class="section">
      <div class="section-header">
        <div class="section-icon" aria-hidden="true">
          <svg class="icon-svg" viewBox="0 0 24 24">
            <path d="M20 6L9 17l-5-5"></path>
          </svg>
        </div>
        <h2 class="section-title">Total Progress</h2>
      </div>

      <div class="progress-wrap">
        <div class="progress-info">
          <span>Fehra</span>
          <span id="fehra-progress-text">0/7</span>
        </div>

        <div class="progress-bar">
          <div class="progress-fill" id="fehra-progress-fill"></div>
        </div>
      </div>

      <div class="progress-wrap">
        <div class="progress-info">
          <span>Others</span>
          <span id="other-progress-text">0/5</span>
        </div>

        <div class="progress-bar">
          <div class="progress-fill" id="other-progress-fill"></div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="section-header">
        <div class="section-icon" aria-hidden="true">
          <svg class="icon-svg" viewBox="0 0 24 24">
            <circle cx="6" cy="15" r="2.2"></circle>
            <circle cx="12" cy="13" r="2.4"></circle>
            <circle cx="18" cy="15" r="2.2"></circle>
            <path d="M7.5 18.5c1.2-2.1 2.7-3.1 4.5-3.1s3.3 1 4.5 3.1c.8 1.5-.2 3.3-1.9 3.3H9.4c-1.7 0-2.7-1.8-1.9-3.3z"></path>
            <circle cx="8.5" cy="8" r="2"></circle>
            <circle cx="15.5" cy="8" r="2"></circle>
          </svg>
        </div>
        <h2 class="section-title">Fehra</h2>
      </div>

      <div class="card">
        <div class="medicine-row">
          <div class="medicine-icon" aria-hidden="true">
            <svg class="icon-svg" viewBox="0 0 24 24">
              <path d="M12 3l7 3v5c0 5-3 8.5-7 10-4-1.5-7-5-7-10V6l7-3z"></path>
              <path d="M12 8v7"></path>
              <path d="M8.5 11.5h7"></path>
            </svg>
          </div>
          <div class="medicine-title">Vetinmune</div>
        </div>

        <div class="checkbox-group">
          <label>
            <input type="checkbox" id="vetinmune-morning">
            <span class="check-box">Morning</span>
          </label>

          <label>
            <input type="checkbox" id="vetinmune-day">
            <span class="check-box">Afternoon</span>
          </label>

          <label>
            <input type="checkbox" id="vetinmune-evening">
            <span class="check-box">Evening</span>
          </label>
        </div>
      </div>

      <div class="card">
        <div class="medicine-row">
          <div class="medicine-icon" aria-hidden="true">
            <svg class="icon-svg" viewBox="0 0 24 24">
              <path d="M8 3v4"></path>
              <path d="M16 3v4"></path>
              <rect x="4" y="5" width="16" height="16" rx="2"></rect>
              <path d="M4 10h16"></path>
            </svg>
          </div>
          <div class="medicine-title">Oftan</div>
        </div>

        <div class="checkbox-group two">
          <label>
            <input type="checkbox" id="oftan-1">
            <span class="check-box">1</span>
          </label>

          <label>
            <input type="checkbox" id="oftan-2">
            <span class="check-box">2</span>
          </label>

          <label>
            <input type="checkbox" id="oftan-3">
            <span class="check-box">3</span>
          </label>

          <label>
            <input type="checkbox" id="oftan-4">
            <span class="check-box">4</span>
          </label>
        </div>
      </div>

      <button class="reset" onclick="resetSection('fehra')">↻ Reset Fehra</button>
    </section>

    <section class="section">
      <div class="section-header">
        <div class="section-icon" aria-hidden="true">
          <svg class="icon-svg" viewBox="0 0 24 24">
            <circle cx="12" cy="7" r="4"></circle>
            <path d="M5 21c1.2-4 3.5-6 7-6s5.8 2 7 6"></path>
          </svg>
        </div>
        <h2 class="section-title">Others</h2>
      </div>

      <div class="card">
        <div class="medicine-row">
          <div class="medicine-icon" aria-hidden="true">
            <span class="icon-text">BP</span>
          </div>
          <div class="medicine-title">Blood pressure</div>
        </div>

        <div class="checkbox-group two">
          <label>
            <input type="checkbox" id="bp-morning">
            <span class="check-box">Morning</span>
          </label>

          <label>
            <input type="checkbox" id="bp-evening">
            <span class="check-box">Evening</span>
          </label>
        </div>
      </div>

      <div class="card">
        <div class="medicine-row">
          <div class="medicine-icon" aria-hidden="true">
            <svg class="icon-svg" viewBox="0 0 24 24">
              <path d="M20.5 8.5c0 6-8.5 11-8.5 11s-8.5-5-8.5-11A4.8 4.8 0 0 1 12 5.2a4.8 4.8 0 0 1 8.5 3.3z"></path>
            </svg>
          </div>
          <div class="medicine-title">Betac</div>
        </div>

        <div class="checkbox-group single">
          <label>
            <input type="checkbox" id="z-daily">
            <span class="check-box">Daily</span>
          </label>
        </div>
      </div>

      <div class="card">
        <div class="medicine-row">
          <div class="medicine-icon" aria-hidden="true">
            <svg class="icon-svg" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v3"></path>
              <path d="M12 19v3"></path>
              <path d="M2 12h3"></path>
              <path d="M19 12h3"></path>
              <path d="M4.9 4.9l2.1 2.1"></path>
              <path d="M17 17l2.1 2.1"></path>
              <path d="M19.1 4.9L17 7"></path>
              <path d="M7 17l-2.1 2.1"></path>
            </svg>
          </div>
          <div class="medicine-title">Vitamin D</div>
        </div>

        <div class="checkbox-group single">
          <label>
            <input type="checkbox" id="vitd-daily">
            <span class="check-box">Daily</span>
          </label>
        </div>
      </div>

      <div class="card">
        <div class="medicine-row">
          <div class="medicine-icon" aria-hidden="true">
            <svg class="icon-svg" viewBox="0 0 24 24">
              <path d="M10 21a5 5 0 0 1-5-5V9a5 5 0 0 1 10 0v7a5 5 0 0 1-5 5z"></path>
              <path d="M5 12h10"></path>
              <path d="M14 3.8A5 5 0 0 1 19 9v7a5 5 0 0 1-5 5"></path>
            </svg>
          </div>
          <div class="medicine-title">Vitamin B12, Folium, Omega, Complex</div>
        </div>

        <div class="checkbox-group single">
          <label>
            <input type="checkbox" id="b12-daily">
            <span class="check-box">Daily</span>
          </label>
        </div>
      </div>

      <button class="reset" onclick="resetSection('other')">↻ Reset Others</button>
    </section>

  </div>

  <script>
    const checkboxes = document.querySelectorAll('input[type="checkbox"]');

    const fehraIds = [
      'vetinmune-morning',
      'vetinmune-day',
      'vetinmune-evening',
      'oftan-1',
      'oftan-2',
      'oftan-3',
      'oftan-4'
    ];

    const otherIds = [
      'bp-morning',
      'bp-evening',
      'z-daily',
      'vitd-daily',
      'b12-daily'
    ];

    function updateProgress(ids, fillId, textId) {
      const checked = ids.filter(id => {
        const box = document.getElementById(id);
        return box && box.checked;
      }).length;

      const total = ids.length;
      const percent = total === 0 ? 0 : Math.round((checked / total) * 100);

      document.getElementById(fillId).style.width = percent + '%';
      document.getElementById(textId).textContent = checked + '/' + total;
    }

    function updateAllProgress() {
      updateProgress(fehraIds, 'fehra-progress-fill', 'fehra-progress-text');
      updateProgress(otherIds, 'other-progress-fill', 'other-progress-text');
    }

    checkboxes.forEach(box => {
      box.checked = localStorage.getItem(box.id) === 'true';

      box.addEventListener('change', () => {
        localStorage.setItem(box.id, box.checked);
        updateAllProgress();
      });
    });

    updateAllProgress();

    function resetSection(section) {
      const ids = section === 'fehra' ? fehraIds : otherIds;

      ids.forEach(id => {
        const box = document.getElementById(id);

        if (box) {
          box.checked = false;
          localStorage.setItem(id, 'false');
        }
      });

      updateAllProgress();
    }
  </script>
</body>
</html>
